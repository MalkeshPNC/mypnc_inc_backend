spring:
  application:
    name: pnc-inc-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/sys?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:pncroot}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    debug: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.flywaydb: DEBUG

document:
  max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10485760}
  allowed-content-types: ${DOCUMENT_ALLOWED_CONTENT_TYPES:}
  storage:
    provider: ${DOCUMENT_STORAGE_PROVIDER:local}
    local:
      root: ${DOCUMENT_STORAGE_ROOT:./data/documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt-secret: ${JWT_SECRET:pnc-masters-dev-jwt-secret-key-32b!!}
  jwt-expiration-ms: ${JWT_EXPIRATION:28800000}
  bootstrap-email: ${AUTH_BOOTSTRAP_EMAIL:admin@mypncinc.local}
  bootstrap-password: ${AUTH_BOOTSTRAP_PASSWORD:Admin123!}
